plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.16'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Forge 1.20.1 要求 Java 17
java.toolchain.languageVersion = JavaLanguageVersion.of(java_version as Integer)

minecraft {
    // 使用官方映射
    mappings channel: mapping_channel, version: mapping_version

    // 默认运行配置
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            // Mixin 调试输出
            arg "-mixin.config=" + mod_id + ".mixins.json"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            arg "-mixin.config=" + mod_id + ".mixins.json"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run-data')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

// MixinGradle 配置：生成 refmap.json 并注册配置
mixin {
    add sourceSets.main, mixin_refmap_name
    config mod_id + ".mixins.json"
    debug.export = true
}

repositories {
    maven {
        url = "https://maven.minecraftforge.net/"
    }
    maven {
        url = "https://libraries.minecraft.net/"
    }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Mixin 注解处理器（必须，否则 refmap 不会生成）
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

// ========== 修复开始：资源处理 ==========
// 删除原有的 generateModMetadata 任务（已移除），
// 现在直接使用标准的 processResources 进行变量展开
processResources {
    // 定义需要替换的属性（与 gradle.properties 中的键名严格一致）
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
    ]
    inputs.properties replaceProperties
    filteringCharset = 'UTF-8'

    // 对 mods.toml 进行展开（模仿成功项目的写法）
    filesMatching('META-INF/mods.toml') {
        expand replaceProperties
    }

    // 其他资源（如 pack.mcmeta）可依样添加，但此处保持默认
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
// ========== 修复结束 ==========

// 注意：原文件中的 sourceSets.main.resources.srcDir generateModMetadata 已被删除
// 现在保留 src/generated/resources 作为额外资源目录（数据生成输出）
sourceSets.main.resources.srcDir 'src/generated/resources'

// 关键修复：把 src/main/templates 加入资源源
// ForgeGradle 在配置 run task 时会读 templates/META-INF/mods.toml，但默认不会把它复制到
// build/resources/main。若不显式加入资源源，运行时 Forge 在 build/resources/main 中找不到
// mods.toml，mod 会被当作无效文件跳过，导致 mixin 应用时找不到目标类而崩溃。
// processResources 块里的 filesMatching('META-INF/mods.toml') { expand ... } 会自动处理变量展开。
sourceSets.main.resources.srcDir 'src/main/templates'

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(ProcessResources).configureEach {
    filteringCharset = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

javadoc {
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.docEncoding = 'UTF-8'
    classpath = sourceSets.main.compileClasspath
    options.addStringOption('Xdoclint:none', '-quiet')
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}