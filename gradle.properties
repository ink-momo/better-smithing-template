# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Environment Properties
# Forge 1.20.1 稳定版本（ Forge 47.x 系列）
minecraft_version=1.20.1
# Forge 版本号必须与 Minecraft 版本兼容
forge_version=47.4.0
# Forge 版本范围（与 mods.toml 中 loaderVersion 一致）
forge_version_range=[47,)
# Minecraft 版本范围
minecraft_version_range=[1.20.1,1.20.2)
# 加载器版本范围
loader_version_range=[47,)

# 官方 Mojang 官方映射
mapping_channel=official
mapping_version=1.20.1

## Mod Properties

# 模组唯一标识符，必须全小写英文，符合 [a-z][a-z0-9_]{1,63}
mod_id=better_smithing_template
# 模组显示名
mod_name=Better Smithing Template
# 模组许可证
mod_license=GPL-3.0
# 模组版本号
mod_version=1.20.1-1.0.4-forge
# 模组作者
mod_authors=ink_moma
# Maven Group ID
mod_group_id=com.mo.better_smithing_template

# Mixin 配置（用于生成 refmap.json，避免 MixinApplyError）
mixin_refmap_name=better_smithing_template.refmap.json

# Java 版本
java_version=17
